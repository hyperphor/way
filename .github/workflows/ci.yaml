name: CI

on:
  push:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install lein
        run: brew install leiningen

      - name: cache dependencies
        uses: actions/cache@v4
        with:
          path: "~/.m2/repository"
          key: ${{ runner.os }}-${{ hashFiles('project.clj') }}

      - name: Run tests
        run: lein test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install lein
        run: brew install leiningen

      - name: Check whether this version is already on Clojars
        id: version
        run: |
          version=$(grep -m1 '^(defproject' project.clj | awk '{print $3}' | tr -d '"')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if curl -sf "https://clojars.org/api/artifacts/com.hyperphor/way" \
              | jq -e --arg v "$version" '(.latest_release == $v) or any(.recent_versions[]?; .version == $v)' \
              > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Requires CLOJARS_USERNAME / CLOJARS_PASSWORD repo secrets.
      - name: Deploy to Clojars
        if: steps.version.outputs.published == 'false'
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: lein deploy clojars
